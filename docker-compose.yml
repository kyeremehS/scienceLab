services:
  postgres:
    image: postgres:17
    container_name: sciencelab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sciencelab
      POSTGRES_PASSWORD: sciencelab_dev
      POSTGRES_DB: sciencelab
    ports:
      - "5432:5432"
    volumes:
      - sciencelab_postgres_data:/var/lib/postgresql/data

  # Local email trap for development (FR-AUTH-01): catches outbound mail,
  # serves it at http://localhost:8025. Never delivers real email.
  mailpit:
    image: axllent/mailpit
    container_name: sciencelab-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  sciencelab_postgres_data: